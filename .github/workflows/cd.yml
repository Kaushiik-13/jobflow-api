name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/jobflow-api:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/jobflow-api:$IMAGE_TAG $ECR_REGISTRY/jobflow-api:latest
          docker push $ECR_REGISTRY/jobflow-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/jobflow-api:latest

      - name: Build and push Nginx image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          docker build -t $ECR_REGISTRY/jobflow-api:nginx-latest -f Dockerfile.nginx .
          docker tag $ECR_REGISTRY/jobflow-api:nginx-latest $ECR_REGISTRY/jobflow-api:nginx-latest
          docker push $ECR_REGISTRY/jobflow-api:nginx-latest

      - name: Deploy to ECS
        env:
          ECS_CLUSTER: jobflow-cluster-production
          ECS_SERVICE: jobflow-service-production
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for deployment
        env:
          ECS_CLUSTER: jobflow-cluster-production
          ECS_SERVICE: jobflow-service-production
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Waiting for deployment to complete..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION
          echo "Deployment complete!"

      - name: Verify deployment
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Checking ECS service status..."
          aws ecs describe-services \
            --cluster jobflow-cluster-production \
            --services jobflow-service-production \
            --region $AWS_REGION \
            --query 'services[0].runningCount'
